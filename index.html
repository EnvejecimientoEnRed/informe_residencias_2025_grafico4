<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Distribución de plazas residenciales por provincia según tamaño del centro</title>

<style>
   body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 25px 20px;
    background: #ffffff;
    color: #333333;
}

.contenedor {
    max-width: 1100px;
    margin: auto;
}

h1 {
    font-size: 25px;
    margin-bottom: 10px;
}

.descripcion {
    color: #666666;
    margin-bottom: 18px;
}

.botones {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 18px;
}

.botones button {
    padding: 8px 14px;
    border: 1px solid #d5d5d5;
    border-radius: 4px;
    background: #eeeeee;
    color: #444444;
    font-size: 13px;
    font-weight: normal;
    cursor: pointer;
    transition: 0.2s;
}

.botones button:hover {
    background: #dddddd;
}

.botones button.activo {
    background: #d0d0d0;
    color: #222222;
    border-color: #bcbcbc;
    font-weight: bold;
}

.mapa {
    width: 100%;
    min-height: 650px;
}

.mapa iframe {
    width: 100%;
    height: 650px;
    border: none;
}

@media (max-width: 650px) {
    .mapa iframe {
        height: 550px;
    }
}
</style>
</head>

<body>

<div class="contenedor">

    <p class="descripcion">
        Pulse en los botones para filtrar el mapa por tamaño del centro.
    </p>

    <div class="botones">

        <button class="activo"
        onclick="cambiarMapa('menos25', this)">
            Menos de 25 plazas
        </button>

        <button
        onclick="cambiarMapa('25a49', this)">
            25 - 49
        </button>

        <button
        onclick="cambiarMapa('50a99', this)">
            50 - 99
        </button>

        <button
        onclick="cambiarMapa('100omas', this)">
            100 ó más
        </button>

    </div>

    <div class="mapa">
        <iframe
            id="mapa"
            src="https://datawrapper.dwcdn.net/Dh7Zv/4/"
            title="Mapa interactivo por provincias">
        </iframe>
    </div>

</div>

<script>

const mapas = {
    menos25: "https://datawrapper.dwcdn.net/Dh7Zv/4/",

    "25a49": "https://datawrapper.dwcdn.net/zmseO/1/",

    "50a99": "https://datawrapper.dwcdn.net/rRFN9/1/",

    "100omas": "https://datawrapper.dwcdn.net/OgSgJ/1/"
};

function cambiarMapa(categoria, boton) {

    document.getElementById("mapa").src = mapas[categoria];

    document.querySelectorAll(".botones button")
        .forEach(b => b.classList.remove("activo"));

    boton.classList.add("activo");
}

</script>

</body>
</html>
